name: Sync wiki

# Keeps the GitHub wiki's Home page in sync with docs/WIKI.md.
# docs/WIKI.md is the source of truth: edits made directly on the
# wiki will be overwritten by the next sync.

on:
  push:
    branches: [ develop ]
    paths: [ docs/WIKI.md ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone wiki
        run: git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Render Home.md from docs/WIKI.md
        run: bash scripts/sync-wiki.sh docs/WIKI.md wiki/Home.md

      - name: Commit and push if changed
        run: |
          cd wiki
          if git diff --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898084+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync wiki from docs/WIKI.md (${{ github.sha }})"
          git push
